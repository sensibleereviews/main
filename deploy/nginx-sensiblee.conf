# Sensiblee — nginx reverse proxy (www / app / admin subdomains)
#
# One Next.js app serves all three surfaces; src/middleware.ts reads the Host
# header and rewrites every path to the right surface:
#   www.sensiblee.in   → marketing website (/, /features, /pricing, /blog …)
#   app.sensiblee.in   → tenant workspace console (/app/…)
#   admin.sensiblee.in → platform admin console (/admin/…)
#
# Install:  cp deploy/nginx-sensiblee.conf /etc/nginx/sites-available/sensiblee
#           ln -s /etc/nginx/sites-available/sensiblee /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
# Then run certbot for HTTPS (see DEPLOYMENT.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Apex canonicalization: sensiblee.in permanently redirects to www.sensiblee.in
# so search engines index exactly one marketing host. www is the canonical
# surface — QR deep links (/g/<code>), OG tags and NEXT_PUBLIC_GUEST_URL all use it.
server {
    listen 80;
    listen [::]:80;
    server_name sensiblee.in;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.sensiblee.in$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sensiblee.in app.sensiblee.in admin.sensiblee.in;

    # CMS media uploads and any large form posts
    client_max_body_size 25m;

    # Security + caching headers for hashed Next.js assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;                 # middleware routes on this
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}

# After `certbot --nginx -d sensiblee.in -d www.sensiblee.in -d app.sensiblee.in -d admin.sensiblee.in`
# certbot rewrites this file to add the TLS listeners and HTTP→HTTPS redirects.
# The apex block keeps its 301 → https://www.sensiblee.in after certbot adds TLS.
