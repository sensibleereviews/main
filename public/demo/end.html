<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sensiblee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1F2937; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #FEFCF5; overflow: hidden;
  }
  .card { text-align: center; animation: rise .8s ease-out both; }
  .plate {
    display: inline-flex; align-items: center; justify-content: center;
    background: #FFFFFF; border-radius: 28px; padding: 22px 30px;
    box-shadow: 0 18px 50px -18px rgba(0,0,0,0.55);
  }
  .plate img { height: 110px; width: auto; }
  .url { margin-top: 42px; font-size: 22px; font-weight: 600; color: #88D6A0; letter-spacing: 0.06em; }
  .trial { margin-top: 14px; font-size: 16px; color: rgba(254,252,245,0.55); }
  .trial b { color: #FEFCF5; }
  .wave { position: fixed; left: 0; right: 0; bottom: 0; height: 10px;
    background: linear-gradient(90deg, #88D6A0 0%, #FEF3C7 100%); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="plate">
      <img src="/brand/logo-footer.png" alt="Sensiblee — Sensing Sensibly. Acting Intelligently.">
    </div>
    <div class="url">www.sensiblee.in</div>
    <div class="trial">Start your <b>free 7-day trial</b> today — no card required</div>
  </div>
  <div class="wave"></div>
</body>
</html>
